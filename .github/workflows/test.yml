name: Test

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [18.x, 20.x]
        python-version: [3.11, 3.12]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Node deps
        run: npm install

      - name: Install Python deps
        run: pip install -r benchmarks/requirements.txt

      - name: Verify repo integrity
        run: python3 tests/verify_repo.py

      - name: Test MCP Shrink
        run: npm test -- tests/test_mcp_shrink.js

      - name: Test hooks
        run: python3 tests/test_hooks.py

      - name: Test tokenzip init
        run: npm test -- tests/test_tokenzip_init.js

      - name: Test tokenzip stats
        run: npm test -- tests/test_tokenzip_stats.js

      - name: Test compress safety
        run: python3 tests/test_compress_safety.py
